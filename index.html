<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F4F5F3">
<title>Карта</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231C5CAB'/%3E%3Ccircle cx='32' cy='20' r='7' fill='%23fff'/%3E%3Ccircle cx='17' cy='44' r='7' fill='%23fff'/%3E%3Ccircle cx='47' cy='44' r='7' fill='%23fff'/%3E%3Cpath d='M32 27v6M32 33l-12 6M32 33l12 6' stroke='%23fff' stroke-width='3' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#F4F5F3; --panel:#FFFFFF; --ink:#14191E; --ink-2:#4A545C; --ink-3:#7C8790;
  --line:#DCE0DD; --line-2:#C9CFCB; --accent:#1C5CAB; --accent-ink:#FFFFFF; --accent-soft:#E4EDF8;
  --ok:#2E7D4F; --warn:#B7791F; --bad:#B83A3A;
  --c-people:#C2841A; --c-income:#2E7D4F; --c-cash:#1C5CAB; --c-sys:#4C6E8F; --c-proc:#6B4FBB; --c-docs:#1B7F86; --c-risk:#B83A3A;
  --shadow:0 10px 30px rgba(20,25,30,.12);
  --font-d:"Geologica",system-ui,sans-serif; --font-b:"Golos Text",system-ui,sans-serif; --font-m:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12171B; --panel:#1A2026; --ink:#EEF1F0; --ink-2:#B4BDC3; --ink-3:#7F8A92;
    --line:#2A3238; --line-2:#3A444C; --accent:#6FA3E6; --accent-ink:#0E1620; --accent-soft:#1E2E42;
    --ok:#5FBF86; --warn:#E0A33A; --bad:#E06A6A;
    --c-people:#E0A33A; --c-income:#5FBF86; --c-cash:#6FA3E6; --c-sys:#8FB0CF; --c-proc:#A48FE0; --c-docs:#5FBFC4; --c-risk:#E06A6A;
    --shadow:0 10px 30px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --paper:#12171B; --panel:#1A2026; --ink:#EEF1F0; --ink-2:#B4BDC3; --ink-3:#7F8A92;
  --line:#2A3238; --line-2:#3A444C; --accent:#6FA3E6; --accent-ink:#0E1620; --accent-soft:#1E2E42;
  --ok:#5FBF86; --warn:#E0A33A; --bad:#E06A6A;
  --c-people:#E0A33A; --c-income:#5FBF86; --c-cash:#6FA3E6; --c-sys:#8FB0CF; --c-proc:#A48FE0; --c-docs:#5FBFC4; --c-risk:#E06A6A;
  --shadow:0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:28px 32px 0;flex-wrap:wrap}
.brand h1{font-family:var(--font-d);font-weight:600;font-size:26px;letter-spacing:-.01em;margin:0;text-wrap:balance}
.brand p{margin:6px 0 0;color:var(--ink-2);max-width:62ch}
.asof{font-family:var(--font-m);font-size:12px;color:var(--ink-3);white-space:nowrap}
.asof b{color:var(--ink);font-weight:500}

.tabs{display:flex;gap:4px;padding:18px 32px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;background:var(--paper);z-index:5}
.tabs button{padding:10px 14px;border-radius:8px 8px 0 0;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--ink);background:var(--accent-soft)}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.view{display:none;padding:24px 32px 48px}
.view.on{display:block}
.intro{max-width:70ch;color:var(--ink-2);margin:0 0 18px}

/* ---- gate ---- */
.gate{max-width:440px;margin:80px auto;padding:0 20px;text-align:center}
.gate h1{font-family:var(--font-d);font-weight:600;font-size:22px;margin:0 0 8px}
.gate p{color:var(--ink-2);margin:0 0 16px}
.gate input{width:100%;padding:12px 14px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit}
.gate button{margin-top:10px;width:100%;padding:12px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.gate .err{color:var(--bad);font-size:13.5px;margin-top:10px;min-height:20px}

/* ---- map ---- */
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 18px;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--dot)}
.mapwrap{overflow-x:auto;padding-bottom:12px}
.map{min-width:1540px;display:flex;flex-direction:column;align-items:center}
.root{background:var(--ink);color:var(--paper);border-radius:12px;padding:16px 22px;text-align:center;position:relative;width:360px}
.root h2{font-family:var(--font-d);font-weight:600;font-size:18px;margin:0}
.root p{margin:4px 0 0;font-size:12.5px;opacity:.8;font-family:var(--font-m)}
.root::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:28px;background:var(--line-2);transform:translateX(-50%)}
.cols{display:grid;grid-template-columns:repeat(7,1fr);gap:14px;width:100%;margin-top:28px;position:relative}
.cols::before{content:"";position:absolute;top:0;left:calc(100%/14);right:calc(100%/14);height:2px;background:var(--line-2)}
.col{position:relative;padding-top:24px}
.col::before{content:"";position:absolute;left:50%;top:0;width:2px;height:24px;background:var(--line-2);transform:translateX(-50%)}
.bh{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--bc);border-radius:10px;padding:10px 12px 11px}
.bh b{font-family:var(--font-d);font-weight:600;font-size:14.5px;display:block}
.bh small{color:var(--ink-3);font-size:12px}
.kids{position:relative;margin:10px 0 0;padding:0 0 0 14px;list-style:none;display:flex;flex-direction:column;gap:8px}
.kids::before{content:"";position:absolute;left:4px;top:-10px;bottom:16px;width:2px;background:var(--line)}
.kids li{position:relative}
.kids li::before{content:"";position:absolute;left:-10px;top:18px;width:10px;height:2px;background:var(--line)}
.node{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 11px 9px 12px;position:relative;transition:border-color .15s,transform .15s}
.node:hover{border-color:var(--bc);transform:translateX(2px)}
.node.sel{border-color:var(--bc);box-shadow:0 0 0 2px color-mix(in srgb,var(--bc) 30%,transparent)}
.node b{font-weight:500;font-size:13.5px;display:block;line-height:1.3;padding-right:14px}
.node small{display:block;color:var(--ink-3);font-size:12px;margin-top:2px;line-height:1.35}
.node .st{position:absolute;right:10px;top:10px;width:8px;height:8px;border-radius:50%}
.st.ok{background:var(--ok)} .st.warn{background:var(--warn)} .st.bad{background:var(--bad)}
.node .n{display:inline-block;margin-top:5px;font-family:var(--font-m);font-size:10.5px;color:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:1px 7px}

/* ---- drawer ---- */
.drawer{position:fixed;top:0;right:0;height:100%;width:min(520px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(102%);transition:transform .22s ease;z-index:20;display:flex;flex-direction:column}
.drawer.open{transform:none}
.dh{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 12px;border-bottom:1px solid var(--line)}
.dh .chip{font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--bc);font-weight:600;font-family:var(--font-d)}
.dh h3{font-family:var(--font-d);font-weight:600;font-size:19px;margin:2px 0 0;line-height:1.25;text-wrap:balance}
.dh .lead{margin:4px 0 0;color:var(--ink-2);font-size:13.5px}
.dh button{margin-left:auto;width:32px;height:32px;border-radius:8px;color:var(--ink-2);flex:none;font-size:18px}
.dh button:hover{background:var(--accent-soft);color:var(--ink)}
.db{overflow:auto;padding:16px 22px 40px;flex:1}
.db h4{font-family:var(--font-d);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:20px 0 8px;font-weight:600}
.db h4:first-child{margin-top:0}
.db p{margin:0 0 10px;max-width:60ch}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:13.5px}
.facts dt{color:var(--ink-3)}
.facts dd{margin:0;font-variant-numeric:tabular-nums}
.facts dd.m{font-family:var(--font-m);font-size:12.5px}
.reg{border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.reg .st{width:9px;height:9px;border-radius:50%;flex:none;margin-top:6px}
.reg b{font-weight:500}
.reg small{display:block;color:var(--ink-2)}
.open{margin:0;padding:0 0 0 18px;font-size:13.5px}
.open li{margin:0 0 6px}
.rel{display:flex;flex-wrap:wrap;gap:6px}
.rel button{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12.5px;color:var(--ink-2)}
.rel button:hover{border-color:var(--accent);color:var(--accent)}
.scrim{position:fixed;inset:0;background:rgba(20,25,30,.25);z-index:19;display:none}
.scrim.on{display:block}
.regbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--accent);color:var(--accent);border-radius:9px;padding:8px 12px;font-size:13.5px;font-weight:500;margin-bottom:12px}
.regbtn:hover{background:var(--accent-soft)}
details.regfold{border:1px solid var(--line);border-radius:9px;padding:0 12px}
details.regfold summary{cursor:pointer;padding:10px 0;font-weight:500;font-size:13.5px;color:var(--ink-2)}
details.regfold[open] summary{border-bottom:1px solid var(--line)}

/* ---- документ регламента ---- */
.doc{font-size:15px;line-height:1.6;max-width:80ch;container-type:inline-size;container-name:doc;overflow-wrap:anywhere}
.doc h1{font-family:var(--font-d);font-size:24px;font-weight:600;margin:0 0 10px;letter-spacing:-.01em;line-height:1.25;text-wrap:balance}
.doc h2{font-family:var(--font-d);font-size:19px;font-weight:600;margin:30px 0 10px;padding-top:16px;border-top:1px solid var(--line);letter-spacing:-.005em}
.doc h1+h2,.doc .meta+h2{border-top:0;padding-top:0;margin-top:18px}
.doc h3{font-family:var(--font-d);font-size:15.5px;font-weight:600;margin:20px 0 6px}
.doc p{margin:0 0 10px}
.doc p.meta{color:var(--ink-3);font-size:13.5px;margin:0 0 16px}
.doc ul,.doc ol{margin:0 0 12px;padding-left:22px}
.doc li{margin-bottom:5px}
.doc ol li::marker{font-family:var(--font-m);font-size:12.5px;color:var(--ink-3)}
.doc ul.chk{list-style:none;padding-left:0}
.doc ul.chk li{position:relative;padding-left:28px}
.doc ul.chk li::before{content:"";position:absolute;left:2px;top:.35em;width:14px;height:14px;border:1.5px solid var(--line-2);border-radius:4px;background:var(--panel)}
.doc code{font-family:var(--font-m);font-size:12.5px;background:var(--accent-soft);padding:1px 5px;border-radius:4px;white-space:normal;overflow-wrap:anywhere}
.doc pre{font-family:var(--font-m);font-size:12px;line-height:1.45;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;margin:0 0 12px}
.doc .tw{margin:0 0 14px}
.doc table{border-collapse:collapse;font-size:13.5px;width:100%}
.doc th{text-align:left;font-family:var(--font-d);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);padding:8px 10px;border-bottom:1px solid var(--line-2);font-weight:600}
.doc td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-variant-numeric:tabular-nums}
.doc td:first-child{font-weight:500}
.doc hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.doc .flow{display:flex;flex-direction:column;gap:8px;margin:0 0 14px}
.doc .fl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 4px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.doc .fn{font-size:13px;line-height:1.35;padding:4px 9px;border-radius:7px;background:var(--panel);border:1px solid var(--line)}
.doc .fn.fs{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.doc .fa{color:var(--ink-3);font-size:13px;padding:0 2px}
@container doc (max-width:600px){
  .doc table,.doc tbody,.doc tr,.doc td{display:block;width:auto}
  .doc thead{display:none}
  .doc tr{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:0 0 8px;background:var(--panel)}
  .doc td{border:0;padding:3px 0}
  .doc td:first-child{font-weight:600;padding-bottom:6px;margin-bottom:4px;border-bottom:1px solid var(--line)}
  .doc td::before{content:attr(data-l);display:block;font-family:var(--font-d);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin-bottom:1px}
  .doc td:first-child::before{display:none}
  .doc td:empty{display:none}
}
.db .doc{font-size:14px}

/* ---- регламенты: читалка ---- */
.reader{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;align-items:start}
.rlist{position:sticky;top:64px;display:flex;flex-direction:column;gap:4px}
.rlist button{text-align:left;padding:8px 10px;border-radius:8px;font-size:13.5px;color:var(--ink-2);display:flex;gap:10px}
.rlist button b{font-family:var(--font-m);font-weight:500;font-size:12px;color:var(--ink-3);flex:none;padding-top:2px}
.rlist button:hover{background:var(--accent-soft);color:var(--ink)}
.rlist button.on{background:var(--accent);color:var(--accent-ink)}
.rlist button.on b{color:var(--accent-ink)}
.rdoc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px 36px 40px;max-width:900px}
.rdoc .file{font-family:var(--font-m);font-size:11.5px;color:var(--ink-3);margin-bottom:10px}

/* ---- связки ---- */
.links figure{margin:0;overflow-x:auto}
.links svg{min-width:900px;max-width:100%;height:auto;display:block;color:var(--ink);font-family:var(--font-b)}
.links figcaption{font-size:13px;color:var(--ink-2);margin-top:10px;max-width:80ch}
.lgd{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin:12px 0 0}
.lgd span{display:inline-flex;align-items:center;gap:6px}
.lgd i{width:22px;height:12px;border:1px solid currentColor;border-radius:3px;display:inline-block}
.lgd i.d{border-style:dashed}
.lgd i.p{background:var(--c-people);opacity:.5;border:0}
.lgd i.m{background:var(--accent-soft);border-width:1.6px}

/* ---- деньги ---- */
.money{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;align-items:start}
.money figure{margin:0}
.split{display:grid;grid-template-columns:200px 28px 200px 28px minmax(0,1fr);gap:10px;align-items:center;font-size:14px}
.sp-src{background:var(--ink);color:var(--paper);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.sp-src small{opacity:.75;font-size:12px}
.sp-src b{font-family:var(--font-d);font-size:26px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.sp-src span{opacity:.75;font-size:12.5px;line-height:1.35}
.sp-gov{border:1.2px solid var(--ink);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.sp-gov>small{color:var(--ink-3);font-size:12px;text-align:center}
.sp-gov .sp-note{color:var(--ink-3);font-size:11.5px;text-align:left;margin-top:2px}
.sp-arrow{height:1.5px;background:var(--ink);position:relative}
.sp-arrow::after{content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left:8px solid var(--ink);border-right:0}
.sp-list{display:flex;flex-direction:column;gap:8px;border-left:1.5px solid var(--ink);padding-left:22px;position:relative;margin:6px 0}
.sp-list .sp-row{position:relative}
.sp-list .sp-row::before{content:"";position:absolute;left:-22px;top:50%;width:14px;height:1.5px;background:var(--ink)}
.sp-list .sp-row::after{content:"";position:absolute;left:-9px;top:50%;margin-top:-4px;border:4px solid transparent;border-left:6px solid var(--ink);border-right:0}
.sp-row{display:flex;justify-content:space-between;align-items:baseline;gap:14px;line-height:1.35}
.sp-row span{min-width:0}
.sp-row i{font-style:normal;color:var(--ink-2);font-size:12.5px}
.sp-list .sp-row i{display:block;margin-top:2px}
.sp-gov .sp-row i::before{content:" · "}
.sp-row em{font-style:normal;font-family:var(--font-m);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.sp-row em.dim{color:var(--ink-3)}
.sp-list .sp-row{padding:10px 14px;border-radius:9px}
.sp-p{background:color-mix(in srgb,var(--c-people) 16%,var(--panel))}
.sp-g{background:color-mix(in srgb,var(--c-cash) 22%,var(--panel));font-weight:600}
.sp-d{border:1px dashed var(--line-2)}
@media (max-width:900px){
  .split{grid-template-columns:1fr}
  .sp-arrow{width:1.5px;height:24px;justify-self:center}
  .sp-arrow::after{right:auto;left:-4px;top:auto;bottom:-1px;border:5px solid transparent;border-top:8px solid var(--ink);border-bottom:0}
  .sp-list{margin:0}
}
.money figcaption{font-size:13px;color:var(--ink-2);margin-top:10px;max-width:70ch}
.rules{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.rules h3{font-family:var(--font-d);font-size:15px;margin:0 0 10px;font-weight:600}
.rules ol{margin:0;padding-left:20px;font-size:13.5px}
.rules li{margin-bottom:7px}
.rules li b{font-weight:500}

/* ---- открытое ---- */
.olist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.oc{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--bc);border-radius:10px;padding:12px 14px;text-align:left}
.oc small{font-family:var(--font-d);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--bc);font-weight:600}
.oc p{margin:4px 0 0;font-size:13.5px}

@media (max-width:760px){
  .top,.tabs,.view{padding-left:16px;padding-right:16px}
  .tabs button{padding:10px 10px;font-size:14px}
  .money,.reader{grid-template-columns:1fr}
  .rlist{position:static;flex-direction:row;flex-wrap:wrap}
  .rlist button{padding:6px 10px;border:1px solid var(--line);border-radius:999px}
  .rlist button b{display:none}
  .rdoc{padding:18px 16px}
  .map{min-width:0;width:100%}
  .cols{grid-template-columns:1fr;gap:18px}
  .cols::before,.col::before,.root::after{display:none}
  .col{padding-top:0}
  .root{width:100%}
}
@media (prefers-reduced-motion:reduce){.drawer,.node{transition:none}}
</style>
</head>
<body>

<div class="gate" id="gate" hidden>
  <h1>Карта</h1>
  <p>Страница открывается только по личной ссылке. Вставьте свою ссылку целиком или ключ из неё.</p>
  <input id="g-in" placeholder="https://karta.ak47-tgk.ru/?k=…" autocomplete="off">
  <button id="g-go">Открыть</button>
  <div class="err" id="g-err"></div>
</div>

<div id="app" hidden>
<header class="top">
  <div class="brand">
    <h1 id="t-title"></h1>
    <p id="t-lead"></p>
  </div>
  <div class="asof">состояние на <b>19.10.2026</b></div>
</header>

const enc=new TextEncoder(),dec=new TextDecoder();
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(key){
  const pack=JSON.parse(atob(BLOB));
  const km=await crypto.subtle.importKey('raw',enc.encode(key),'PBKDF2',false,['deriveKey']);
  for(const w of pack.keys){
    try{
      const kek=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(w.salt),iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
      const ck=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(w.iv)},kek,b64(w.w));
      const k2=await crypto.subtle.importKey('raw',ck,'AES-GCM',false,['decrypt']);
      const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(pack.iv)},k2,b64(pack.ct));
      return JSON.parse(dec.decode(raw));
    }catch(e){}
  }
  return null;
}
function keyFrom(s){s=(s||'').trim();try{const u=new URL(s);return u.searchParams.get('k')||s}catch(e){return s.replace(/^.*[?&]k=/,'').replace(/[&#].*$/,'')}}
const gate=document.getElementById('gate'),app=document.getElementById('app');
async function start(){
  const u=new URL(location.href);let k=u.searchParams.get('k');
  if(k){try{localStorage.setItem('karta_key',k)}catch(e){} u.searchParams.delete('k');history.replaceState(null,'',u.pathname+(u.search||'')+u.hash)}
  else{try{k=localStorage.getItem('karta_key')}catch(e){}}
  if(!k){gate.hidden=false;return}
  const p=await unlock(k);
  if(!p){gate.hidden=false;document.getElementById('g-err').textContent='Ключ не подходит. Вставьте свою ссылку целиком.';try{localStorage.removeItem('karta_key')}catch(e){}return}
  gate.hidden=true;app.hidden=false;render(p);
}
document.getElementById('g-go').onclick=async()=>{
  const k=keyFrom(document.getElementById('g-in').value);if(!k)return;
  const p=await unlock(k);
  if(!p){document.getElementById('g-err').textContent='Ключ не подходит. Проверьте ссылку.';return}
  try{localStorage.setItem('karta_key',k)}catch(e){}
  gate.hidden=true;app.hidden=false;render(p);
};
document.getElementById('g-in').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('g-go').click()});

let P=null;
const REGST={ok:"описано, работает",warn:"описано, есть открытые пункты",bad:"требует действия"};
function render(p){
  P=p;
  const BR=p.branches,N=p.nodes;
  // карта
  const map=document.getElementById('map');
  const S=p.shell||{};
  document.title=S.title||'Карта';
  const txt=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v||''};
  txt('t-title',S.title);txt('t-lead',S.lead);txt('links-intro',S.links_intro);txt('links-cap',S.links_caption);txt('regs-intro',S.regs_intro);txt('open-intro',S.open_intro);
  document.getElementById('money').innerHTML=S.money||'';
  map.innerHTML=`<div class="root"><h2>${(S.root||{}).h||''}</h2><p>${(S.root||{}).p||''}</p></div><div class="cols" id="cols"></div>`;
  const cols=document.getElementById('cols');
  for(const [k,b] of Object.entries(BR)){
    const items=N.filter(n=>n.b===k);
    const col=document.createElement('div');col.className='col';col.style.setProperty('--bc',b.c);
    col.innerHTML=`<div class="bh"><b>${b.name}</b><small>${b.sub} · ${items.length}</small></div><ul class="kids">${items.map(n=>`<li><button class="node" data-id="${n.id}"><span class="st ${n.st}"></span><b>${n.t}</b><small>${n.s}</small>${n.open?`<span class="n">${n.open.length} откр.</span>`:''}</button></li>`).join('')}</ul>`;
    cols.appendChild(col);
  }
  // связки
  document.getElementById('links-svg').innerHTML=p.links;
  // регламенты
  const rl=document.getElementById('rlist');
  rl.innerHTML=p.regs.map(r=>`<button data-reg="${r.id}"><b>${r.id}</b><span>${r.title}</span></button>`).join('');
  showReg(p.regs[0].id);
  // открытое
  document.getElementById('olist').innerHTML=N.filter(n=>n.open).flatMap(n=>n.open.map(o=>`<button class="oc" data-id="${n.id}" style="--bc:${BR[n.b].c}"><small>${n.t}</small><p>${o}</p></button>`)).join('');
}
function showReg(id){
  const r=P.regs.find(x=>x.id===id);if(!r)return;
  document.querySelectorAll('.rlist button').forEach(b=>b.classList.toggle('on',b.dataset.reg===id));
  document.getElementById('rdoc').innerHTML=`<div class="file">Регламенты/${r.file}</div><div class="doc"><h1>${r.id}. ${r.title}</h1>${r.html}</div>`;
  window.scrollTo({top:0});
}
const drawer=document.getElementById('drawer'),scrim=document.getElementById('scrim');
function openNode(id){
  const n=P.nodes.find(x=>x.id===id);if(!n)return;
  const b=P.branches[n.b],r=P.regs.find(x=>x.id===n.reg);
  drawer.style.setProperty('--bc',b.c);
  document.getElementById('d-chip').textContent=b.name;
  document.getElementById('d-title').textContent=n.t;
  document.getElementById('d-lead').textContent=n.s;
  let h='';
  if(n.facts){h+=`<h4>Коротко</h4><dl class="facts">${n.facts.map(([k,v])=>`<dt>${k}</dt><dd class="${/\d/.test(v)&&v.length<40?'m':''}">${v}</dd>`).join('')}</dl>`;}
  h+=`<h4>Как устроено</h4>`+n.body.map(p=>`<p>${p}</p>`).join('');
  h+=`<h4>Состояние</h4><div class="reg"><span class="st ${n.st}"></span><div><b>${REGST[n.st]}</b><small>${n.open?n.open.length+' открытых пункт(а) ниже':'открытых пунктов нет'}</small></div></div>`;
  if(n.open){h+=`<h4>Открыто</h4><ul class="open">${n.open.map(o=>`<li>${o}</li>`).join('')}</ul>`;}
  if(n.rel){h+=`<h4>Связано</h4><div class="rel">${n.rel.map(x=>{const t=P.nodes.find(y=>y.id===x);return t?`<button data-id="${x}">${t.t}</button>`:''}).join('')}</div>`;}
  if(r){h+=`<h4>Регламент ${r.id}</h4><button class="regbtn" data-reg="${r.id}">Открыть «${r.title}» на отдельной вкладке →</button><details class="regfold" open><summary>${r.id}. ${r.title}</summary><div class="doc">${r.html}</div></details>`;}
  document.getElementById('d-body').innerHTML=h;
  document.querySelectorAll('.node').forEach(e=>e.classList.toggle('sel',e.dataset.id===id));
  drawer.classList.add('open');drawer.setAttribute('aria-hidden','false');scrim.classList.add('on');
  document.getElementById('d-body').scrollTop=0;
}
function closeD(){drawer.classList.remove('open');drawer.setAttribute('aria-hidden','true');scrim.classList.remove('on');document.querySelectorAll('.node.sel').forEach(e=>e.classList.remove('sel'));}
function showTab(v){
  document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x.dataset.v===v));
  document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button[data-id]');if(b){openNode(b.dataset.id);return}
  const r=e.target.closest('button[data-reg]');if(r){closeD();showTab('regs');showReg(r.dataset.reg);return}
  const t=e.target.closest('.tabs button');if(t){showTab(t.dataset.v);closeD();}
});
document.getElementById('d-close').onclick=closeD;scrim.onclick=closeD;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeD();});
start();
</script>
</body>
</html>
